spring.application.name=zaid-portfolio

# Persistent local database. The data directory is created on first run.
spring.datasource.url=jdbc:h2:file:./data/portfolio-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Useful while developing locally. Do not expose this console publicly.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

server.port=${PORT:8080}
server.error.include-message=never
